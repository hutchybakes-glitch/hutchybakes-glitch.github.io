<body>
  <a class="skip" href="#work">Skip to projects</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="mark" href="#top" aria-label="Back to top"><span aria-hidden="true">SH</span></a>
      <nav aria-label="Main">
        <ul class="nav">
          <li><a href="#work">Work</a></li>
          <li><a href="#toolkit">Toolkit</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>

  <main id="top">
    <section class="hero wrap" aria-labelledby="hero-name">
      <p class="eyebrow" id="hero-role"></p>
      <h1 id="hero-name"></h1>
      <p class="positioning" id="hero-positioning"></p>
      <div class="intro" id="hero-intro"></div>
      <ul class="links" id="hero-links" aria-label="Contact and profiles"></ul>
    </section>

    <section class="featured wrap" id="featured" aria-label="Featured project"></section>

    <section class="work wrap" id="work" aria-labelledby="work-title">
      <div class="section-head">
        <h2 id="work-title">Projects</h2>
        <div class="filters" id="filters" role="group" aria-label="Filter projects by type" hidden></div>
      </div>
      <ul class="grid" id="grid"></ul>
    </section>

    <section class="toolkit" id="toolkit" aria-labelledby="toolkit-title">
      <div class="wrap">
        <h2 id="toolkit-title">Toolkit</h2>
        <ul class="tools" id="tools"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="wrap footer-row">
      <div>
        <p class="footer-name" id="footer-name"></p>
        <p class="footer-note">All projects use public data only. Nothing here comes from an employer.</p>
      </div>
      <ul class="links small" id="footer-links" aria-label="Contact and profiles"></ul>
    </div>
  </footer>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-inner" id="detail-body"></div>
  </dialog>
